<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="felt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <radialGradient id="redBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>
    <radialGradient id="blackBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="cueBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background / Baize -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#felt)" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Cushion boundary -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Snooker Balls in dynamic layout -->
  <!-- Red Ball 1 -->
  <circle cx="220" cy="220" r="54" fill="url(#redBall)" filter="url(#shadow)" />
  <ellipse cx="205" cy="205" rx="14" ry="8" fill="#ffffff" opacity="0.6" transform="rotate(-30 205 205)" />

  <!-- Red Ball 2 -->
  <circle cx="295" cy="225" r="54" fill="url(#redBall)" filter="url(#shadow)" />
  <ellipse cx="280" cy="210" rx="14" ry="8" fill="#ffffff" opacity="0.6" transform="rotate(-30 280 210)" />

  <!-- Black Ball -->
  <circle cx="256" cy="305" r="54" fill="url(#blackBall)" filter="url(#shadow)" />
  <ellipse cx="242" cy="290" rx="14" ry="8" fill="#ffffff" opacity="0.4" transform="rotate(-30 242 290)" />

  <!-- Cue Ball (white) striking in -->
  <circle cx="160" cy="360" r="44" fill="url(#cueBall)" filter="url(#shadow)" />
  <ellipse cx="150" cy="348" rx="12" ry="7" fill="#ffffff" opacity="0.9" transform="rotate(-35 150 348)" />

  <!-- Cue Stick line -->
  <line x1="80" y1="440" x2="135" y2="385" stroke="#d97706" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  <line x1="125" y1="395" x2="135" y2="385" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
</svg>
